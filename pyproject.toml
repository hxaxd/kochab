[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kochab"
version = "0.1.0"
description = "Evaluation-driven harness evolution: reference abstractions and local skill tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "hxaxd" }]
keywords = ["agents", "evals", "prompt-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
]

[project.scripts]
kochab = "kochab.local.cli:main"

[project.urls]
Repository = "https://github.com/hxaxd/kochab"
Issues = "https://github.com/hxaxd/kochab/issues"
Documentation = "https://github.com/hxaxd/kochab#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/kochab"]
